name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Host tests Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - name: Host tests
        if: runner.os != 'Linux'
        run: npm run test:host
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-earth-${{ matrix.os }}
          path: |
            artifacts/*.vsix
            artifacts/booking-report.*
# Switch install to npm ci after committing a reviewed registry-generated lockfile. No publish job.

